seed: 1
data:
  streams_dir: data/streams
  block_length: 256
  train_fraction: 1.0
embedding:
  init: file
  path: data/embeddings/glove_300_scaled.npy
  freeze: true
optim:
  lr: 0.002
  weight_decay: 0.01
  betas:
  - 0.9
  - 0.999
  eps: 1.0e-08
  warmup_steps: 300
  final_lr_fraction: 0.1
  grad_clip: 1.0
  batch_size: 64
train:
  max_epochs: 12
  schedule_epochs: 12
  patience: 3
  evaluate_test: true
  log_every: 50
run_name: part2/lstm_glovescaled_s1
model:
  type: lstm
  d_model: 300
  hidden: 512
  n_layers: 2
  dropout: 0.3
